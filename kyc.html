<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Verify Identity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    var isDark = document.documentElement.classList.contains('theme-dark') ||
      (!document.documentElement.classList.contains('theme-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    meta.setAttribute('content', isDark ? '#0b1210' : '#0f9d8c');
  }
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="headerBack()"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <a class="icon-btn" href="https://whatsapp.com/channel/0029VbDYtgnDuMRX0yFQVo1h" target="_blank" rel="noopener" style="text-decoration:none;"><i class="fa-brands fa-whatsapp"></i></a>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Verify Identity</div>

  <div id="statusView" style="display:none;">
    <div class="profile-card reveal" style="text-align:center;padding:32px 20px;">
      <i id="statusIcon" class="fa-solid fa-clock" style="font-size:36px;color:var(--brand);margin-bottom:12px;"></i>
      <div id="statusTitle" style="font-weight:800;font-size:16px;margin-bottom:6px;">Pending Review</div>
      <div id="statusText" style="font-size:13px;color:var(--text-dim);">Your documents are under review. This usually takes 24-48 hours.</div>
    </div>
  </div>

  <div id="formView" style="display:none;">
    <div class="step-dots">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <div id="step1" class="kyc-step">
      <div class="referral-earn-note">
        <i class="fa-solid fa-circle-info" style="margin-right:6px;color:var(--brand);"></i>
        We will look up the name registered to this number.
      </div>
      <div style="margin-bottom:16px;">
        <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Mobile Money Number</label>
        <input type="tel" id="momoNumber" placeholder="e.g. 233246912184" oninput="onMomoInput()">
        <div id="verifyStatus" style="font-size:12px;color:var(--text-dim);margin:-8px 0 14px 4px;min-height:16px;"></div>
        <div id="verifiedNameBox" class="verified-name-box" style="display:none;margin-bottom:0;">
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Registered Name</div>
          <div class="verified-name-value" id="verifiedNameValue">...</div>
        </div>
      </div>
      <button id="step1NextBtn" onclick="goToStep(2)" disabled style="opacity:0.5;">Next</button>
    </div>

    <div id="step2" class="kyc-step" style="display:none;">
      <div class="section-title" style="margin-top:0;font-size:14px;">Choose your ID type</div>
      <div class="id-type-grid">
        <div class="id-type-option" data-value="ghana_card" onclick="selectIdType(this)">
          <i class="fa-solid fa-id-card"></i>
          <div class="id-type-option-name">Ghana Card</div>
        </div>
        <div class="id-type-option" data-value="hnis_card" onclick="selectIdType(this)">
          <i class="fa-solid fa-id-badge"></i>
          <div class="id-type-option-name">HNIS Card</div>
        </div>
        <div class="id-type-option" data-value="voters_id" onclick="selectIdType(this)">
          <i class="fa-solid fa-address-card"></i>
          <div class="id-type-option-name">Voters ID</div>
        </div>
      </div>
    </div>

    <div id="step3" class="kyc-step" style="display:none;">
      <div class="section-title" style="margin-top:0;font-size:14px;">Take your photos</div>
      <label class="photo-upload-box" id="selfieBox">
        <div class="photo-icon-circle"><i class="fa-solid fa-camera"></i></div>
        <div class="photo-upload-title" id="selfieTitle">Take a picture of yourself</div>
        <div class="photo-upload-hint" id="selfieHint">Tap to open camera</div>
        <div class="photo-preview-wrap" id="selfiePreviewWrap" style="display:none;">
          <img id="selfiePreview" class="photo-preview">
          <div class="photo-check-badge"><i class="fa-solid fa-check"></i></div>
        </div>
        <input type="file" accept="image/*" capture="user" id="selfieFile" style="display:none;" onchange="previewPhoto(this,'selfieBox','selfiePreview','selfiePreviewWrap','selfieTitle','selfieHint')">
      </label>
      <label class="photo-upload-box" id="idBox">
        <div class="photo-icon-circle"><i class="fa-solid fa-id-card"></i></div>
        <div class="photo-upload-title" id="idTitle">Take a picture of your ID (front)</div>
        <div class="photo-upload-hint" id="idHint">Tap to open camera</div>
        <div class="photo-preview-wrap" id="idPreviewWrap" style="display:none;">
          <img id="idPreview" class="photo-preview">
          <div class="photo-check-badge"><i class="fa-solid fa-check"></i></div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="idFile" style="display:none;" onchange="previewPhoto(this,'idBox','idPreview','idPreviewWrap','idTitle','idHint')">
      </label>
      <button id="submitBtn" onclick="submitForm()">Submit for Review</button>
      <div id="debugErrorBox" style="display:none;margin-top:16px;padding:14px;background:rgba(244,63,94,0.08);border:1px solid #f43f5e;border-radius:14px;font-size:12px;color:#f43f5e;word-break:break-word;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { auth, getUserProfile, submitKYC } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const WORKER_URL = 'https://rancharm-worker.antwordtech.workers.dev';
  let currentUser = null;
  let verifiedName = '';
  let selectedIdType = '';

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const profile = await getUserProfile(user.uid);
    if (!profile) { window.location.href = 'complete-profile.html'; return; }
    currentUser = user;

    const status = profile.kycStatus || 'unverified';

    if (status === 'approved' || status === 'verified') {
      document.getElementById('statusView').style.display = 'block';
      document.getElementById('statusIcon').className = 'fa-solid fa-circle-check';
      document.getElementById('statusIcon').style.color = 'var(--brand)';
      document.getElementById('statusTitle').textContent = "You're Verified";
      document.getElementById('statusText').textContent = 'Your identity has been confirmed. You have full access to earning and withdrawals.';
    } else if (status === 'pending') {
      document.getElementById('statusView').style.display = 'block';
    } else if (status === 'rejected') {
      document.getElementById('statusView').style.display = 'block';
      document.getElementById('statusIcon').className = 'fa-solid fa-circle-exclamation';
      document.getElementById('statusIcon').style.color = '#f43f5e';
      document.getElementById('statusTitle').textContent = 'Verification Rejected';
      document.getElementById('statusText').textContent = 'Your last submission was not approved. Contact support via WhatsApp, or try again below.';
      document.getElementById('formView').style.display = 'block';
    } else {
      document.getElementById('formView').style.display = 'block';
    }

    document.body.classList.add('ready');
  });

  let currentStep = 1;
  window.goToStep = (n) => {
    currentStep = n;
    [1, 2, 3].forEach(i => {
      document.getElementById('step' + i).style.display = i === n ? 'block' : 'none';
      document.getElementById('dot' + i).classList.toggle('active', i === n);
    });
  };
  window.headerBack = () => {
    if (currentStep > 1) {
      goToStep(currentStep - 1);
    } else {
      window.location.href = 'profile.html';
    }
  };

  let verifyTimer = null;
  window.onMomoInput = () => {
    clearTimeout(verifyTimer);
    document.getElementById('verifiedNameBox').style.display = 'none';
    document.getElementById('step1NextBtn').disabled = true;
    document.getElementById('step1NextBtn').style.opacity = '0.5';
    document.getElementById('verifyStatus').textContent = '';
    const val = document.getElementById('momoNumber').value.trim();
    if (val.length < 9) return;
    verifyTimer = setTimeout(verifyNumber, 700);
  };

  async function verifyNumber() {
    const number = document.getElementById('momoNumber').value.trim();
    if (!number) return;
    const statusEl = document.getElementById('verifyStatus');
    statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="color:var(--brand);"></i> Verifying...';
    try {
      const res = await fetch(WORKER_URL + '/verify-sim?phone=' + encodeURIComponent(number));
      const data = await res.json();
      if (!res.ok || !data.ok) { throw new Error(data.error || 'Could not verify this number'); }
      verifiedName = data.registered_name;
      document.getElementById('verifiedNameValue').textContent = verifiedName;
      document.getElementById('verifiedNameBox').style.display = 'block';
      document.getElementById('step1NextBtn').disabled = false;
      document.getElementById('step1NextBtn').style.opacity = '1';
      statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--brand);"></i> Verified';
    } catch (error) {
      statusEl.innerHTML = '<span style="color:#f43f5e;">' + error.message + '</span>';
    }
  }

  window.selectIdType = (el) => {
    document.querySelectorAll('.id-type-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedIdType = el.dataset.value;
    setTimeout(() => goToStep(3), 350);
  };

  window.previewPhoto = (input, boxId, previewId, wrapId, titleId, hintId) => {
    const file = input.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    document.getElementById(previewId).src = url;
    document.getElementById(wrapId).style.display = 'block';
    document.getElementById(boxId).classList.add('has-file');
    document.getElementById(titleId).textContent = 'Photo captured';
    document.getElementById(hintId).textContent = 'Tap to retake';
  };

  window.submitForm = async () => {
    const idFile = document.getElementById('idFile').files[0];
    const selfieFile = document.getElementById('selfieFile').files[0];
    const momoNumber = document.getElementById('momoNumber').value.trim();
    if (!idFile || !selfieFile) { toast('Both photos are required', 'error'); return; }
    const btn = document.getElementById('submitBtn');
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
    btn.classList.add('btn-loading');
    try {
      await submitKYC(currentUser, {
        mobileMoneyNumber: momoNumber,
        registeredName: verifiedName,
        idType: selectedIdType,
        idFile: idFile,
        selfieFile: selfieFile
      });
      toast('Submitted! We will review it shortly.', 'success');
      setTimeout(function() { window.location.href = 'profile.html'; }, 1200);
    } catch (error) {
      btn.innerHTML = original;
      btn.classList.remove('btn-loading');
      console.error('KYC submit error:', error);
      toast('Submission failed. Please try again.', 'error');
    }
  };
</script>
</body>
</html>
