<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Admin Withdrawals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='admin-dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Withdrawal Requests</div>
  <div id="withdrawalsList">
    <div class="skeleton" style="height:120px;margin-bottom:14px;"></div>
    <div class="skeleton" style="height:120px;margin-bottom:14px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, doc, updateDoc, increment, isAdmin, getUserProfile, collection, query, where, getDocs } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, async function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!isAdmin(user)) { window.location.href = 'dashboard.html'; return; }

    await loadWithdrawals();
    document.body.classList.add('ready');
  });

  async function loadWithdrawals() {
    const list = document.getElementById('withdrawalsList');
    const snap = await getDocs(query(collection(db, "withdrawals"), where("status", "==", "pending")));

    if (snap.empty) {
      list.innerHTML = '<div class="empty-note">No pending withdrawal requests.</div>';
      return;
    }

    list.innerHTML = '';
    let i = 0;
    for (const docSnap of snap.docs) {
      const w = docSnap.data();
      const wid = docSnap.id;
      const profile = await getUserProfile(w.uid);
      const email = (profile && profile.email) || w.uid;

      const card = document.createElement('div');
      card.className = 'profile-card reveal';
      card.style.marginBottom = '14px';
      card.style.animationDelay = (i * 0.05) + 's';
      i++;
      card.innerHTML = `
        <div class="profile-row"><div class="profile-row-label">User</div><div class="profile-row-value">${email}</div></div>
        <div class="profile-row"><div class="profile-row-label">Requested</div><div class="profile-row-value">GHS ${w.amountGHS}</div></div>
        <div class="profile-row"><div class="profile-row-label">Fee (Network+Rancharm)</div><div class="profile-row-value">GHS ${w.totalFee || 0}</div></div>
        <div class="profile-row"><div class="profile-row-label">Pay Out</div><div class="profile-row-value" style="color:var(--brand-dark);font-weight:800;">GHS ${w.payoutAmount || w.amountGHS}</div></div>
        <div class="profile-row"><div class="profile-row-label">Network</div><div class="profile-row-value">${w.network}</div></div>
        <div class="profile-row"><div class="profile-row-label">Phone</div><div class="profile-row-value">${w.phone}</div></div>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <button class="btn-danger" onclick="rejectWithdrawal('${wid}', '${w.uid}', ${w.pointsHeld}, this)">Reject &amp; Refund</button>
          <button onclick="approveWithdrawal('${wid}', this)">Mark Paid</button>
        </div>
      `;
      list.appendChild(card);
    }
  }

  window.approveWithdrawal = async function(wid, btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await updateDoc(doc(db, "withdrawals", wid), { status: "paid" });
      toast('Marked as paid', 'success');
      await loadWithdrawals();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };

  window.rejectWithdrawal = async function(wid, uid, pointsHeld, btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await Promise.all([
        updateDoc(doc(db, "withdrawals", wid), { status: "rejected" }),
        updateDoc(doc(db, "wallets", uid), { points: increment(pointsHeld) })
      ]);
      toast('Rejected and points refunded', 'success');
      await loadWithdrawals();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
