<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>

</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Admin Panel</div>
  <div class="nav-grid">
    <a class="nav-tile reveal" href="admin-kyc.html">
      <i class="fa-solid fa-id-card" style="color:var(--brand);display:block;font-size:20px;margin-bottom:8px;"></i>
      KYC Approvals
      <div id="kycPendingCount" style="font-size:11px;color:var(--text-dim);margin-top:4px;">Loading...</div>
    </a>
    <a class="nav-tile reveal" style="animation-delay:0.05s" href="admin-tasks.html">
      <i class="fa-solid fa-list-check" style="color:var(--brand);display:block;font-size:20px;margin-bottom:8px;"></i>
      Manage Tasks
      <div id="taskCount" style="font-size:11px;color:var(--text-dim);margin-top:4px;">Loading...</div>
    </a>
    <a class="nav-tile reveal" style="animation-delay:0.1s" href="admin-withdrawals.html">
      <i class="fa-solid fa-arrow-up-from-bracket" style="color:var(--brand);display:block;font-size:20px;margin-bottom:8px;"></i>
      Withdrawals
      <div id="withdrawalCount" style="font-size:11px;color:var(--text-dim);margin-top:4px;">Loading...</div>
    </a>
  </div>
</div>

<script type="module">
  import { auth, db, isAdmin, collection, query, where, getDocs } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!isAdmin(user)) { window.location.href = 'dashboard.html'; return; }

    const pendingSnap = await getDocs(query(collection(db, "kyc"), where("status", "==", "pending")));
    document.getElementById('kycPendingCount').textContent = pendingSnap.size + ' pending';

    const tasksSnap = await getDocs(collection(db, "tasks"));
    document.getElementById('taskCount').textContent = tasksSnap.size + ' total';

    const pendingWithdrawalsSnap = await getDocs(query(collection(db, "withdrawals"), where("status", "==", "pending")));
    document.getElementById('withdrawalCount').textContent = pendingWithdrawalsSnap.size + ' pending';

    document.body.classList.add('ready');
  });
</script>
</body>
</html>
