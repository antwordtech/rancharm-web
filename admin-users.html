<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Admin Users</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='admin-dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Manage Users</div>

  <div class="verified-name-box" style="margin-bottom:20px;">
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Total Users</div>
    <div class="verified-name-value" id="totalUsers">-</div>
  </div>

  <input type="text" id="searchInput" placeholder="Search by email" oninput="filterUsers()" style="margin-bottom:20px;">

  <div id="usersList">
    <div class="skeleton" style="height:140px;margin-bottom:14px;"></div>
    <div class="skeleton" style="height:140px;margin-bottom:14px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, doc, updateDoc, increment, isAdmin, ANIMALS, collection, getDocs } from './firebase-config.js?v=3';
  import { onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const WORKER_URL = 'https://rancharm-worker.antwordtech.workers.dev';
  let allUsers = [];

  onAuthStateChanged(auth, async function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!isAdmin(user)) { window.location.href = 'dashboard.html'; return; }

    await loadUsers();
    document.body.classList.add('ready');
  });

  async function loadUsers() {
    const list = document.getElementById('usersList');

    const [usersSnap, walletsSnap] = await Promise.all([
      getDocs(collection(db, "users")),
      getDocs(collection(db, "wallets"))
    ]);

    const walletMap = {};
    walletsSnap.forEach(function(docSnap) { walletMap[docSnap.id] = docSnap.data(); });

    allUsers = [];
    usersSnap.forEach(function(docSnap) {
      const u = docSnap.data();
      const wallet = walletMap[docSnap.id] || { points: 0 };
      allUsers.push({ uid: docSnap.id, ...u, points: wallet.points || 0 });
    });

    document.getElementById('totalUsers').textContent = allUsers.length.toLocaleString();
    renderUsers(allUsers);
  }

  function renderUsers(users) {
    const list = document.getElementById('usersList');
    if (!users.length) {
      list.innerHTML = '<div class="empty-note">No users found.</div>';
      return;
    }

    list.innerHTML = '';
    users.forEach(function(u, i) {
      const animal = ANIMALS.find(function(a) { return a.key === (u.animalTier || 'cock'); });
      const card = document.createElement('div');
      card.className = 'profile-card reveal';
      card.style.marginBottom = '14px';
      card.style.animationDelay = (Math.min(i, 10) * 0.03) + 's';
      card.innerHTML = `
        <div class="profile-row"><div class="profile-row-label">Email</div><div class="profile-row-value">${u.email || u.uid}</div></div>
        <div class="profile-row"><div class="profile-row-label">Points</div><div class="profile-row-value" id="points-${u.uid}">${(u.points || 0).toLocaleString()}</div></div>
        <div class="profile-row"><div class="profile-row-label">Ranch Level</div><div class="profile-row-value">${animal ? animal.name : 'Cock'}</div></div>
        <div class="profile-row"><div class="profile-row-label">Subscription</div><div class="profile-row-value">${u.subscriptionTier || 'free'}</div></div>
        <div class="profile-row"><div class="profile-row-label">KYC</div><div class="profile-row-value">${u.kycStatus || 'unverified'}</div></div>

        <input type="number" id="amount-${u.uid}" placeholder="Points amount" style="margin-top:10px;">
        <div style="display:flex;gap:10px;margin-bottom:10px;">
          <button class="btn-small" onclick="adjustPoints('${u.uid}', 1, this)">Add</button>
          <button class="btn-small" style="background:#f43f5e;" onclick="adjustPoints('${u.uid}', -1, this)">Deduct</button>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn-small" onclick="resetPassword('${u.email || ''}', this)">Reset Password</button>
          <button class="btn-small" style="background:#f43f5e;" onclick="deleteUserClick('${u.uid}', this)">Delete User</button>
        </div>
      `;
      list.appendChild(card);
    });
  }

  window.filterUsers = function() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { renderUsers(allUsers); return; }
    renderUsers(allUsers.filter(function(u) { return (u.email || '').toLowerCase().includes(q); }));
  };

  window.adjustPoints = async function(uid, sign, btn) {
    const input = document.getElementById('amount-' + uid);
    const amount = parseInt(input.value, 10);
    if (!amount || amount <= 0) { toast('Enter a valid amount', 'error'); return; }

    btn.disabled = true;
    try {
      await updateDoc(doc(db, "wallets", uid), { points: increment(sign * amount) });
      toast(sign > 0 ? 'Points added' : 'Points deducted', 'success');
      await loadUsers();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };

  window.resetPassword = async function(email, btn) {
    if (!email) { toast('No email on file for this user', 'error'); return; }
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await sendPasswordResetEmail(auth, email);
      toast('Reset email sent', 'success');
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Reset Password';
    }
  };

  window.deleteUserClick = async function(uid, btn) {
    if (!confirm('Permanently delete this user? This cannot be undone.')) return;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      const adminIdToken = await auth.currentUser.getIdToken();
      const res = await fetch(WORKER_URL + '/admin-delete-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminIdToken: adminIdToken, targetUid: uid })
      });
      const data = await res.json();

      if (data.ok) {
        toast('User deleted', 'success');
        await loadUsers();
      } else {
        toast(data.error || 'Delete failed', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Delete User';
      }
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Delete User';
    }
  };
</script>
</body>
</html>
