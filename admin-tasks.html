<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Admin Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>

</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;color:var(--brand);"></i></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='admin-dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Manage Tasks</div>

  <div class="profile-card" style="margin-bottom:20px;">
    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Title</label>
    <input type="text" id="newTitle" placeholder="e.g. Follow us on social media">
    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Description</label>
    <input type="text" id="newDesc" placeholder="Short description">
    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Points Reward</label>
    <input type="number" id="newPoints" placeholder="50">
    <button id="addTaskBtn" onclick="addTask()">Add Task</button>
  </div>

  <div class="section-title" style="font-size:14px;">Existing Tasks</div>
  <div id="tasksList">
    <div class="skeleton" style="height:80px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:80px;margin-bottom:12px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, doc, addDoc, updateDoc, deleteDoc, isAdmin, collection, getDocs } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!isAdmin(user)) { window.location.href = 'dashboard.html'; return; }

    await loadTasks();
    document.body.classList.add('ready');
  });

  async function loadTasks() {
    const list = document.getElementById('tasksList');
    const snap = await getDocs(collection(db, "tasks"));

    if (snap.empty) {
      list.innerHTML = '<div class="empty-note">No tasks yet — add one above.</div>';
      return;
    }

    list.innerHTML = '';
    let i = 0;
    snap.forEach((docSnap) => {
      const task = docSnap.data();
      const taskId = docSnap.id;

      const item = document.createElement('div');
      item.className = 'task-card reveal';
      item.style.animationDelay = (i * 0.05) + 's';
      i++;
      item.innerHTML = `
        <div>
          <div class="task-title">${task.title}</div>
          <div class="task-desc">${task.description || ''} · +${task.pointsReward} pts</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <button class="btn-small" onclick="toggleActive('${taskId}', ${task.active}, this)">${task.active ? 'Active' : 'Inactive'}</button>
          <button class="btn-small" style="background:#f43f5e;" onclick="removeTask('${taskId}', this)">Delete</button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  window.addTask = async () => {
    const title = document.getElementById('newTitle').value.trim();
    const description = document.getElementById('newDesc').value.trim();
    const pointsReward = parseInt(document.getElementById('newPoints').value, 10);

    if (!title || !pointsReward) { toast('Title and points reward are required', 'error'); return; }

    const btn = document.getElementById('addTaskBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Adding...';

    try {
      await addDoc(collection(db, "tasks"), { title, description, pointsReward, active: true });
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newPoints').value = '';
      toast('Task added', 'success');
      await loadTasks();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Add Task';
    }
  };

  window.toggleActive = async (taskId, current, btn) => {
    btn.disabled = true;
    try {
      await updateDoc(doc(db, "tasks", taskId), { active: !current });
      await loadTasks();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };

  window.removeTask = async (taskId, btn) => {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await deleteDoc(doc(db, "tasks", taskId));
      toast('Task deleted', 'success');
      await loadTasks();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
