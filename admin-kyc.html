<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Admin KYC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>

</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px;color:var(--brand);"></i></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='admin-dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">KYC Approvals</div>
  <div id="kycList">
    <div class="skeleton" style="height:220px;margin-bottom:14px;"></div>
    <div class="skeleton" style="height:220px;margin-bottom:14px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, doc, updateDoc, isAdmin, collection, query, where, getDocs } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!isAdmin(user)) { window.location.href = 'dashboard.html'; return; }

    await loadPending();
    document.body.classList.add('ready');
  });

  async function loadPending() {
    const list = document.getElementById('kycList');
    const snap = await getDocs(query(collection(db, "kyc"), where("status", "==", "pending")));

    if (snap.empty) {
      list.innerHTML = '<div class="empty-note">No pending submissions right now.</div>';
      return;
    }

    list.innerHTML = '';
    let i = 0;
    snap.forEach((docSnap) => {
      const data = docSnap.data();
      const uid = docSnap.id;

      const card = document.createElement('div');
      card.className = 'profile-card reveal';
      card.style.marginBottom = '14px';
      card.style.animationDelay = (i * 0.05) + 's';
      i++;
      card.innerHTML = `
        <div class="profile-row"><div class="profile-row-label">Name</div><div class="profile-row-value">${data.registeredName || '-'}</div></div>
        <div class="profile-row"><div class="profile-row-label">Mobile Money</div><div class="profile-row-value">${data.mobileMoneyNumber || '-'}</div></div>
        <div class="profile-row"><div class="profile-row-label">ID Type</div><div class="profile-row-value">${(data.idType || '-').replace('_',' ')}</div></div>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <a href="${data.selfiePhotoUrl}" target="_blank" style="flex:1;">
            <img src="${data.selfiePhotoUrl}" style="width:100%;height:100px;object-fit:cover;border-radius:12px;">
          </a>
          <a href="${data.idPhotoUrl}" target="_blank" style="flex:1;">
            <img src="${data.idPhotoUrl}" style="width:100%;height:100px;object-fit:cover;border-radius:12px;">
          </a>
        </div>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <button class="btn-danger" onclick="rejectKyc('${uid}', this)">Reject</button>
          <button onclick="approveKyc('${uid}', this)">Approve</button>
        </div>
      `;
      list.appendChild(card);
    });
  }

  window.approveKyc = async (uid, btn) => {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await Promise.all([
        updateDoc(doc(db, "kyc", uid), { status: "approved" }),
        updateDoc(doc(db, "users", uid), { kycStatus: "approved" })
      ]);
      toast('Approved', 'success');
      await loadPending();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };

  window.rejectKyc = async (uid, btn) => {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await Promise.all([
        updateDoc(doc(db, "kyc", uid), { status: "rejected" }),
        updateDoc(doc(db, "users", uid), { kycStatus: "rejected" })
      ]);
      toast('Rejected', 'success');
      await loadPending();
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
