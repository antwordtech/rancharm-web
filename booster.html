<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Social Booster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="headerBack()"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Social Booster</div>

  <div class="verified-name-box" style="margin-bottom:20px;">
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Your Points Balance</div>
    <div class="verified-name-value" id="pointsBalance">-</div>
  </div>

  <div style="display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:20px;border:1px solid var(--border);">
    <button id="tabNewOrder" onclick="switchTab('new')" style="flex:1;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;font-size:13px;">New Order</button>
    <button id="tabMyOrders" onclick="switchTab('orders')" style="flex:1;background:transparent;color:var(--text-dim);border:none;border-radius:10px;padding:10px;font-weight:700;font-size:13px;">My Orders</button>
  </div>

  <div id="newOrderView">
    <div class="step-dots">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <div id="step1" class="kyc-step">
    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Category</label>
    <select id="categorySelect" style="width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:16px;font-size:14px;" onchange="onCategoryChange()"></select>

    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Service</label>
    <select id="serviceSelect" style="width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:6px;font-size:14px;" onchange="onServiceChange()"></select>
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:16px;" id="serviceLimits"></div>

    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Link</label>
    <input type="text" id="boostLink" placeholder="Paste your post/profile link">

    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Quantity</label>
    <input type="number" id="boostQuantity" placeholder="e.g. 1000">

    <button id="quoteBtn" onclick="getQuote()" style="margin-top:16px;">Get Quote</button>
  </div>

    <div id="step2" class="kyc-step" style="display:none;">
      <div class="verified-name-box" style="margin-bottom:20px;">
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Total Price</div>
        <div class="verified-name-value" id="quotePrice">-</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:6px;" id="quotePoints"></div>
      </div>
      <button id="payBtn" onclick="placeOrder()">Confirm &amp; Pay</button>
      <div class="step-back" onclick="goToStep(1)" style="margin-top:16px;">Back</div>
    </div>

    <div id="step3" class="kyc-step" style="display:none;text-align:center;padding:40px 0;">
      <i class="fa-solid fa-circle-check" style="font-size:48px;color:var(--brand);margin-bottom:16px;"></i>
      <div style="font-weight:800;font-size:18px;margin-bottom:8px;">Order Placed!</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:24px;" id="successText">Your order is being processed.</div>
      <button onclick="switchTab('orders')">View My Orders</button>
    </div>
  </div>

  <div id="ordersView" style="display:none;">
    <div id="ordersList">
      <div class="skeleton" style="height:90px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:90px;margin-bottom:12px;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db, getUserProfile, getOrCreateWallet, collection, query, where, getDocs, orderBy } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const WORKER_URL = 'https://rancharm-worker.antwordtech.workers.dev';
  let currentUser = null;
  let currentPoints = 0;
  let currentStep = 1;
  let categoriesData = {};
  let selectedService = null;
  let quotePrice = 0;
  let currentTab = 'new';

  onAuthStateChanged(auth, async function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    const profile = await getUserProfile(user.uid);
    if (!profile) { window.location.href = 'complete-profile.html'; return; }
    currentUser = user;

    const wallet = await getOrCreateWallet(user);
    currentPoints = wallet.points || 0;
    document.getElementById('pointsBalance').textContent = currentPoints.toLocaleString() + ' pts';

    await loadServices();
    document.body.classList.add('ready');
  });

  async function loadServices() {
    try {
      const res = await fetch(WORKER_URL + '/fricopay-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method: 'GET', path: '/devapi/booster/services' })
      });
      const data = await res.json();
      categoriesData = data.categories || {};

      const catSelect = document.getElementById('categorySelect');
      catSelect.innerHTML = '';
      Object.keys(categoriesData).forEach(function(cat) {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });
      onCategoryChange();
    } catch (e) {
      toast('Could not load services. Try again.', 'error');
    }
  }

  window.onCategoryChange = function() {
    const cat = document.getElementById('categorySelect').value;
    const services = categoriesData[cat] || [];
    const svcSelect = document.getElementById('serviceSelect');
    svcSelect.innerHTML = '';
    services.forEach(function(s) {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      svcSelect.appendChild(opt);
    });
    onServiceChange();
  };

  window.onServiceChange = function() {
    const cat = document.getElementById('categorySelect').value;
    const svcId = parseInt(document.getElementById('serviceSelect').value, 10);
    const services = categoriesData[cat] || [];
    selectedService = services.find(function(s) { return s.id === svcId; });
    if (selectedService) {
      document.getElementById('serviceLimits').textContent =
        'Min ' + selectedService.min.toLocaleString() + ' \u2014 Max ' + selectedService.max.toLocaleString() +
        ' \u00b7 From GHS ' + selectedService.starting_price_ghs;
    }
  };

  window.goToStep = function(n) {
    currentStep = n;
    [1, 2, 3].forEach(function(i) {
      document.getElementById('step' + i).style.display = i === n ? 'block' : 'none';
      document.getElementById('dot' + i).classList.toggle('active', i === n);
    });
  };

  window.headerBack = function() {
    if (currentTab === 'orders') {
      switchTab('new');
    } else if (currentStep === 2) {
      goToStep(1);
    } else {
      window.location.href = 'marketplace.html';
    }
  };

  window.switchTab = function(tab) {
    currentTab = tab;
    document.getElementById('newOrderView').style.display = tab === 'new' ? 'block' : 'none';
    document.getElementById('ordersView').style.display = tab === 'orders' ? 'block' : 'none';

    const newBtn = document.getElementById('tabNewOrder');
    const ordersBtn = document.getElementById('tabMyOrders');
    newBtn.style.background = tab === 'new' ? 'var(--brand)' : 'transparent';
    newBtn.style.color = tab === 'new' ? '#fff' : 'var(--text-dim)';
    ordersBtn.style.background = tab === 'orders' ? 'var(--brand)' : 'transparent';
    ordersBtn.style.color = tab === 'orders' ? '#fff' : 'var(--text-dim)';

    if (tab === 'orders') loadOrders();
  };

  window.getQuote = async function() {
    const link = document.getElementById('boostLink').value.trim();
    const quantity = parseInt(document.getElementById('boostQuantity').value, 10);

    if (!link || !quantity || !selectedService) { toast('Fill in the link and quantity', 'error'); return; }
    if (quantity < selectedService.min || quantity > selectedService.max) {
      toast('Quantity must be between ' + selectedService.min + ' and ' + selectedService.max, 'error');
      return;
    }

    const btn = document.getElementById('quoteBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Getting Quote...';

    try {
      const res = await fetch(WORKER_URL + '/fricopay-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method: 'POST', path: '/devapi/booster/quote', params: { service_id: selectedService.id, quantity: quantity } })
      });
      const data = await res.json();
      const basePrice = data.total_price_ghs || data.price || (data.data && data.data.price) || 0;

      if (!basePrice) { toast('Could not get a quote for this quantity', 'error'); return; }

      quotePrice = Math.round((basePrice + 5) * 100) / 100;

      document.getElementById('quotePrice').textContent = 'GHS ' + quotePrice;
      document.getElementById('quotePoints').textContent = 'Costs ' + Math.round(quotePrice * 100).toLocaleString() + ' points';
      goToStep(2);
    } catch (e) {
      toast('Something went wrong. Try again.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Get Quote';
    }
  };

  window.placeOrder = async function() {
    const link = document.getElementById('boostLink').value.trim();
    const quantity = parseInt(document.getElementById('boostQuantity').value, 10);
    const pointsCost = Math.round(quotePrice * 100);

    if (pointsCost > currentPoints) { toast('Insufficient points balance', 'error'); return; }

    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

    try {
      const res = await fetch(WORKER_URL + '/spend-booster', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uid: currentUser.uid,
          service_id: selectedService.id,
          service_name: selectedService.name,
          link: link,
          quantity: quantity,
          amountGHS: quotePrice,
          user_reference: currentUser.uid
        })
      });
      const data = await res.json();

      if (data.ok) {
        document.getElementById('successText').textContent = selectedService.name + ' order placed for ' + quantity.toLocaleString() + '.';
        goToStep(3);
      } else if (data.error === 'Insufficient points balance') {
        toast('Insufficient points balance', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Confirm & Pay';
      } else {
        toast(data.error || 'Something went wrong. Try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Confirm & Pay';
      }
    } catch (e) {
      toast('Something went wrong. Try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Confirm & Pay';
    }
  };

  async function loadOrders() {
    const list = document.getElementById('ordersList');
    try {
      const snap = await getDocs(query(collection(db, "boosterOrders"), where("uid", "==", currentUser.uid)));

      if (snap.empty) {
        list.innerHTML = '<div class="empty-note">No orders yet.</div>';
        return;
      }

      const orders = [];
      snap.forEach(function(docSnap) { orders.push({ id: docSnap.id, ...docSnap.data() }); });
      orders.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

      list.innerHTML = '';
      orders.forEach(function(order, i) {
        const item = document.createElement('div');
        item.className = 'task-card reveal';
        item.style.animationDelay = (i * 0.03) + 's';
        item.innerHTML =
          '<div><div class="task-title">' + (order.service_name || 'Order') + '</div>' +
          '<div class="task-desc">' + (order.quantity || 0).toLocaleString() + ' &middot; GHS ' + order.price + '</div></div>' +
          '<button class="btn-small" data-order-id="' + order.order_id + '" onclick="checkOrderStatus(this)">' + (order.status || 'pending') + '</button>';
        list.appendChild(item);
      });
    } catch (e) {
      list.innerHTML = '<div class="empty-note">Could not load orders.</div>';
    }
  }

  window.checkOrderStatus = async function(btn) {
    const orderId = btn.dataset.orderId;
    if (!orderId) { toast('No order ID on file for this order', 'error'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

    try {
      const res = await fetch(WORKER_URL + '/fricopay-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method: 'GET', path: '/devapi/booster/order/' + orderId })
      });
      const data = await res.json();
      const status = data.status || (data.data && data.data.status) || 'unknown';
      btn.innerHTML = status;
    } catch (e) {
      btn.innerHTML = 'Error';
    } finally {
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
