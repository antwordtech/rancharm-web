<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Transactions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Transactions</div>
  <div id="txList">
    <div class="skeleton" style="height:70px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:70px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:70px;margin-bottom:10px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, collection, query, where, orderBy, getDocs } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const TYPE_ICONS = {
    feed: 'fa-paw',
    airtime: 'fa-mobile-screen',
    data: 'fa-wifi',
    tv: 'fa-tv',
    ecg: 'fa-bolt',
    water: 'fa-droplet',
    booster: 'fa-rocket',
    withdrawal: 'fa-arrow-up-from-bracket',
    task_reward: 'fa-list-check',
    referral_commission: 'fa-user-group',
    admin_adjustment: 'fa-user-shield'
  };

  onAuthStateChanged(auth, async function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    await loadTransactions(user.uid);
    document.body.classList.add('ready');
  });

  async function loadTransactions(uid) {
    const list = document.getElementById('txList');

    let snap;
    try {
      snap = await getDocs(query(collection(db, "transactions"), where("uid", "==", uid), orderBy("createdAt", "desc")));
    } catch (e) {
      snap = await getDocs(query(collection(db, "transactions"), where("uid", "==", uid)));
    }

    if (snap.empty) {
      list.innerHTML = '<div class="empty-note">No transactions yet.</div>';
      return;
    }

    const txs = [];
    snap.forEach(function(docSnap) { txs.push(docSnap.data()); });
    txs.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    list.innerHTML = '';
    txs.forEach(function(tx, i) {
      const isPositive = (tx.amount || 0) >= 0;
      const icon = TYPE_ICONS[tx.type] || 'fa-coins';
      const dateStr = tx.createdAt ? new Date(tx.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

      const item = document.createElement('div');
      item.className = 'service-row reveal';
      item.style.animationDelay = (Math.min(i, 15) * 0.03) + 's';
      item.innerHTML =
        '<div class="service-icon-circle"><i class="fa-solid ' + icon + '"></i></div>' +
        '<div><div class="service-row-title">' + (tx.description || tx.type) + '</div><div class="service-row-desc">' + dateStr + '</div></div>' +
        '<div style="margin-left:auto;font-weight:800;color:' + (isPositive ? 'var(--brand-dark)' : '#f43f5e') + ';">' +
        (isPositive ? '+' : '') + (tx.amount || 0).toLocaleString() + '</div>';
      list.appendChild(item);
    });
  }
</script>
</body>
</html>
