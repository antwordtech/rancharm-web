<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="headerBack()"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div id="listView">
    <div class="section-title" style="margin-top:0">Tasks</div>
    <div id="tasksList">
      <div class="skeleton" style="height:90px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:90px;margin-bottom:12px;"></div>
    </div>
  </div>

  <div id="detailView" style="display:none;">
    <div class="verified-name-box" style="text-align:center;margin-bottom:20px;">
      <img id="detailImage" style="width:100%;max-height:160px;object-fit:cover;border-radius:16px;margin-bottom:16px;display:none;">
      <div style="font-weight:800;font-size:18px;margin-bottom:6px;" id="detailTitle">-</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;" id="detailDesc">-</div>
      <div style="font-size:13px;font-weight:700;color:var(--brand-dark);" id="detailReward">-</div>
    </div>

    <a id="detailLinkBtn" href="#" target="_blank" rel="noopener" style="display:none;text-decoration:none;">
      <button style="width:100%;margin-bottom:20px;">Go to Task</button>
    </a>

    <div id="answerField" style="display:none;">
      <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Your Answer</label>
      <input type="text" id="submitAnswer" placeholder="Type your answer">
    </div>

    <div id="linkField" style="display:none;">
      <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Proof Link</label>
      <input type="text" id="submitLink" placeholder="Paste your post or profile link">
    </div>

    <div id="photoField" style="display:none;">
      <label class="photo-upload-box" id="photoBox">
        <div class="photo-icon-circle"><i class="fa-solid fa-camera"></i></div>
        <div class="photo-upload-title" id="photoTitle">Upload proof photo</div>
        <div class="photo-upload-hint" id="photoHint">Tap to choose a photo</div>
        <div class="photo-preview-wrap" id="photoPreviewWrap" style="display:none;">
          <img id="photoPreview" class="photo-preview">
          <div class="photo-check-badge"><i class="fa-solid fa-check"></i></div>
        </div>
        <input type="file" accept="image/*" id="submitPhotoFile" style="display:none;" onchange="previewSubmitPhoto(this)">
      </label>
    </div>

    <button id="submitTaskBtn" onclick="submitTask()" style="margin-top:16px;">Submit for Review</button>
  </div>

  <div id="successView" style="display:none;text-align:center;padding:40px 0;">
    <i class="fa-solid fa-clock" style="font-size:48px;color:var(--brand);margin-bottom:16px;"></i>
    <div style="font-weight:800;font-size:18px;margin-bottom:8px;">Submitted!</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:24px;">Your submission is pending review. You'll be credited once approved.</div>
    <button onclick="window.location.href='tasks.html'">Back to Tasks</button>
  </div>
</div>

<script type="module">
  import { auth, db, storage, getUserProfile, collection, query, where, getDocs, addDoc } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const TIER_RANK = { free: 0, premium: 1, vip: 2, elite: 3 };
  let currentUser = null;
  let userTierRank = 0;
  let submittedTaskIds = {};
  let selectedTask = null;
  let selectedTaskId = null;
  let photoFile = null;
  let inDetailView = false;

  onAuthStateChanged(auth, async function(user) {
    if (!user) { window.location.href = 'login.html'; return; }

    const [profile, submissionsSnap, tasksSnap] = await Promise.all([
      getUserProfile(user.uid),
      getDocs(query(collection(db, "taskSubmissions"), where("uid", "==", user.uid))),
      getDocs(query(collection(db, "tasks"), where("active", "==", true)))
    ]);

    if (!profile) { window.location.href = 'complete-profile.html'; return; }
    currentUser = user;
    userTierRank = TIER_RANK[profile.subscriptionTier || 'free'] || 0;

    submissionsSnap.forEach(function(docSnap) {
      const sub = docSnap.data();
      submittedTaskIds[sub.taskId] = sub.status;
    });

    renderTasks(tasksSnap);
    document.body.classList.add('ready');
  });

  function renderTasks(snap) {
    const list = document.getElementById('tasksList');

    const eligible = [];
    snap.forEach(function(docSnap) {
      const task = docSnap.data();
      const taskRank = TIER_RANK[task.requiredTier || 'free'] || 0;
      if (userTierRank >= taskRank) {
        eligible.push({ id: docSnap.id, ...task });
      }
    });

    if (!eligible.length) {
      list.innerHTML = '<div class="empty-note">No tasks available right now.</div>';
      return;
    }

    list.innerHTML = '';
    eligible.forEach(function(task, i) {
      const status = submittedTaskIds[task.id];
      const item = document.createElement('div');
      item.className = 'task-card reveal';
      item.style.animationDelay = (i * 0.05) + 's';

      let actionHtml = '';
      if (status === 'approved') {
        actionHtml = '<div class="owned-badge">Completed</div>';
      } else if (status === 'pending') {
        actionHtml = '<div class="owned-badge" style="background:rgba(148,163,184,0.15);color:var(--text-dim);">Pending Review</div>';
      } else {
        actionHtml = '<button class="btn-small" data-task-id="' + task.id + '" onclick="openTaskClick(this)">Do Task</button>';
      }

      item.innerHTML =
        '<div><div class="task-title">' + task.title + '</div><div class="task-desc">' + (task.description || '') + ' &middot; +' + task.pointsReward + ' pts</div></div>' +
        actionHtml;
      list.appendChild(item);
    });

    window.__tasksData = eligible;
  }

  window.openTaskClick = function(btn) {
    const taskId = btn.dataset.taskId;
    const task = window.__tasksData.find(function(t) { return t.id === taskId; });
    if (!task) return;
    openTask(task, taskId);
  };

  function openTask(task, taskId) {
    selectedTask = task;
    selectedTaskId = taskId;
    photoFile = null;

    document.getElementById('detailTitle').textContent = task.title;
    document.getElementById('detailDesc').textContent = task.description || '';
    document.getElementById('detailReward').textContent = '+' + task.pointsReward + ' points on approval';

    const img = document.getElementById('detailImage');
    if (task.imageUrl) { img.src = task.imageUrl; img.style.display = 'block'; } else { img.style.display = 'none'; }

    const linkBtn = document.getElementById('detailLinkBtn');
    if (task.link) { var normalizedLink = /^https?:\/\//i.test(task.link) ? task.link : 'https://' + task.link; linkBtn.href = normalizedLink; linkBtn.style.display = 'block'; } else { linkBtn.style.display = 'none'; }

    document.getElementById('answerField').style.display = task.requireAnswer ? 'block' : 'none';
    document.getElementById('linkField').style.display = task.requireLink ? 'block' : 'none';
    document.getElementById('photoField').style.display = task.requirePhoto ? 'block' : 'none';

    document.getElementById('submitAnswer').value = '';
    document.getElementById('submitLink').value = '';
    document.getElementById('photoPreviewWrap').style.display = 'none';
    document.getElementById('photoBox').classList.remove('has-file');
    document.getElementById('photoTitle').textContent = 'Upload proof photo';
    document.getElementById('photoHint').textContent = 'Tap to choose a photo';

    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('successView').style.display = 'none';
    inDetailView = true;
  }

  window.headerBack = function() {
    if (inDetailView) {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      inDetailView = false;
    } else {
      window.location.href = 'dashboard.html';
    }
  };

  window.previewSubmitPhoto = function(input) {
    const file = input.files[0];
    if (!file) return;
    photoFile = file;
    const url = URL.createObjectURL(file);
    document.getElementById('photoPreview').src = url;
    document.getElementById('photoPreviewWrap').style.display = 'block';
    document.getElementById('photoBox').classList.add('has-file');
    document.getElementById('photoTitle').textContent = 'Photo selected';
    document.getElementById('photoHint').textContent = 'Tap to change';
  };

  window.submitTask = async function() {
    const answer = document.getElementById('submitAnswer').value.trim();
    const link = document.getElementById('submitLink').value.trim();

    if (selectedTask.requireAnswer && !answer) { toast('Please enter your answer', 'error'); return; }
    if (selectedTask.requireLink && !link) { toast('Please enter your proof link', 'error'); return; }
    if (selectedTask.requirePhoto && !photoFile) { toast('Please upload a proof photo', 'error'); return; }

    const btn = document.getElementById('submitTaskBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

    try {
      let photoUrl = '';
      if (photoFile) {
        const photoRef = ref(storage, 'taskSubmissions/' + currentUser.uid + '_' + selectedTaskId + '/photo.jpg');
        await uploadBytes(photoRef, photoFile);
        photoUrl = await getDownloadURL(photoRef);
      }

      await addDoc(collection(db, "taskSubmissions"), {
        uid: currentUser.uid,
        taskId: selectedTaskId,
        taskTitle: selectedTask.title,
        pointsReward: selectedTask.pointsReward,
        answer: answer,
        link: link,
        photoUrl: photoUrl,
        status: 'pending',
        createdAt: Date.now()
      });

      document.getElementById('detailView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch (e) {
      toast('Something went wrong: ' + e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Submit for Review';
    }
  };
</script>
</body>
</html>
