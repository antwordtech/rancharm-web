<script>
function syncThemeColor(){
  var meta = document.getElementById('metaTheme');
  if (!meta) return;
  var isDark = document.documentElement.classList.contains('theme-dark') ||
    (!document.documentElement.classList.contains('theme-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  meta.setAttribute('content', isDark ? '#0b1210' : '#0f9d8c');
}
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
  syncThemeColor();
})();
window.toggleTheme = function() {
  var html = document.documentElement;
  var isDark = html.classList.contains('theme-dark');
  html.classList.remove('theme-dark','theme-light');
  if (isDark) { html.classList.add('theme-light'); localStorage.setItem('rancharm-theme','light'); }
  else { html.classList.add('theme-dark'); localStorage.setItem('rancharm-theme','dark'); }
  syncThemeSwitch();
  syncThemeColor();
};
function syncThemeSwitch(){
  var sw = document.getElementById('themeSwitch');
  if (!sw) return;
  var isDark = document.documentElement.classList.contains('theme-dark') ||
    (!document.documentElement.classList.contains('theme-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  sw.classList.toggle('on', isDark);
}
document.addEventListener('DOMContentLoaded', function(){ syncThemeSwitch(); syncThemeColor(); });
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>

</head>
<body>

<div class="page">
  <div class="section-title" style="margin-top:0">Tasks</div>
  <div id="tasksList">
    <div class="skeleton" style="height:70px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:70px;margin-bottom:12px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, doc, updateDoc, increment, arrayUnion, collection, query, where, getDocs, getUserProfile } from './firebase-config.js?v=3';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  window.openDrawer = () => {
    document.getElementById('drawerBackdrop').classList.add('open');
    document.getElementById('drawerPanel').classList.add('open');
    document.body.classList.add('drawer-open');
  };
  window.closeDrawer = () => {
    document.getElementById('drawerBackdrop').classList.remove('open');
    document.getElementById('drawerPanel').classList.remove('open');
    document.body.classList.remove('drawer-open');
  };
  window.confirmLogout = () => {
    document.getElementById('logoutModalBackdrop').classList.add('open');
  };
  window.closeLogoutModal = (e) => {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('logoutModalBackdrop').classList.remove('open');
  };
  window.doLogout = async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  };

  let currentUid = null;
  let completedTasks = [];
  let kycApproved = false;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }

    const [profile, tasksSnap] = await Promise.all([
      getUserProfile(user.uid),
      getDocs(query(collection(db, "tasks"), where("active", "==", true)))
    ]);
    if (!profile) { window.location.href = 'complete-profile.html'; return; }

    currentUid = user.uid;
    completedTasks = profile.completedTasks || [];
    kycApproved = (profile.kycStatus || 'unverified') === 'approved';

    const initial = (user.email || '?').charAt(0).toUpperCase();
    document.getElementById('drawerAvatar').textContent = initial;
    document.getElementById('drawerEmail').textContent = user.email || '...';

    renderTasks(tasksSnap);
    document.body.classList.add('ready');
  });

  function renderTasks(snap) {
    const list = document.getElementById('tasksList');

    if (snap.empty) {
      list.innerHTML = '<div class="empty-note">No active tasks right now. Check back soon.</div>';
      return;
    }

    list.innerHTML = '';
    let i = 0;
    snap.forEach((docSnap) => {
      const task = docSnap.data();
      const taskId = docSnap.id;
      const done = completedTasks.includes(taskId);

      const item = document.createElement('div');
      item.className = 'task-card reveal';
      item.style.animationDelay = (i * 0.05) + 's';
      i++;
      item.innerHTML = `
        <div>
          <div class="task-title">${task.title}</div>
          <div class="task-desc">${task.description || ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="task-reward">+${task.pointsReward} pts</div>
          ${done ? '<div class="owned-badge">Done</div>' : `<button class="btn-small" onclick="claimTask(this,'${taskId}', ${task.pointsReward})">Claim</button>`}
        </div>
      `;
      list.appendChild(item);
    });
  }

  window.claimTask = async (btn, taskId, reward) => {
    if (completedTasks.includes(taskId)) return;

    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    btn.classList.add('btn-loading');

    try {
      await Promise.all([
        updateDoc(doc(db, "users", currentUid), { completedTasks: arrayUnion(taskId) }),
        updateDoc(doc(db, "wallets", currentUid), { points: increment(reward), lastUpdated: Date.now() })
      ]);
      completedTasks.push(taskId);
      toast(`+${reward} points claimed!`, 'success');
      const done = document.createElement('div');
      done.className = 'owned-badge';
      done.textContent = 'Done';
      btn.replaceWith(done);
    } catch (e) {
      btn.innerHTML = original;
      btn.classList.remove('btn-loading');
      toast('Could not claim task. Try again.', 'error');
    }
  };
</script>
</body>
