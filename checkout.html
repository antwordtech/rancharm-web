<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
})();
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  console.error('Page error:', msg);
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<i class="fa-solid fa-cloud-arrow-down" style="font-size:32px;color:var(--brand);margin-bottom:14px;display:block;"></i>' +
    '<div style="font-weight:800;font-size:16px;margin-bottom:8px;">Having Trouble Loading</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;">Check your internet connection and try again.</div>' +
    '<button onclick="location.reload()" style="width:auto;padding:10px 20px;">Retry</button></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="headerBack()"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <div style="width:40px;"></div>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Checkout</div>
  <div class="step-dots">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <div id="step1" class="kyc-step">
    <div class="animal-detail-card" style="text-align:center;margin-bottom:20px;">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">You're purchasing</div>
      <div style="font-size:20px;font-weight:800;" id="itemName">-</div>
      <div style="font-size:24px;font-weight:800;color:var(--brand-dark);margin-top:6px;" id="itemPrice">-</div>
    </div>

    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">Mobile Money Number</label>
    <input type="tel" id="payPhone" placeholder="Enter your number">

    <button id="payBtn" onclick="initiatePayment()" style="margin-top:20px;">Pay Now</button>
  </div>

  <div id="step2" class="kyc-step" style="display:none;">
    <div class="referral-earn-note reveal">
      <i class="fa-solid fa-circle-info" style="margin-right:6px;color:var(--brand);"></i>
      Enter the OTP code sent to your phone via SMS.
    </div>
    <label style="font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px;">OTP Code</label>
    <input type="text" id="otpInput" placeholder="123456">
    <button id="otpBtn" onclick="submitOtp()" style="margin-top:16px;">Confirm</button>
  </div>

  <div id="step3" class="kyc-step" style="display:none;text-align:center;padding:40px 0;">
    <i class="fa-solid fa-spinner fa-spin" style="font-size:36px;color:var(--brand);margin-bottom:16px;" id="processingIcon"></i>
    <div style="font-weight:800;font-size:16px;" id="processingText">Confirming your payment...</div>
    <div style="font-size:12px;color:var(--text-dim);margin-top:8px;" id="processingHint">This can take a few minutes. Please don't close this page.</div>
    <button id="retryCheckBtn" onclick="retryCheckStatus()" style="display:none;margin-top:20px;width:auto;padding:12px 24px;">Check Again</button>
  </div>

  <div id="step4" class="kyc-step" style="display:none;text-align:center;padding:40px 0;">
    <i class="fa-solid fa-circle-check" style="font-size:48px;color:var(--brand);margin-bottom:16px;"></i>
    <div style="font-weight:800;font-size:18px;margin-bottom:8px;">Purchase Complete!</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:24px;" id="successText">You've upgraded successfully.</div>
    <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
  </div>
</div>

<script type="module">
  import { auth, getUserProfile, ANIMALS, SUBSCRIPTIONS } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const WORKER_URL = 'https://rancharm-worker.antwordtech.workers.dev';
  const params = new URLSearchParams(window.location.search);
  const tierType = params.get('type');
  const tierKey = params.get('key');

  let currentUser = null;
  let itemPrice = 0;

  function detectNetwork(phone) {
    let n = phone.replace(/\s+/g, '');
    if (n.startsWith('+233')) n = '0' + n.slice(4);
    else if (n.startsWith('233')) n = '0' + n.slice(3);
    const prefix = n.slice(0, 3);
    const mtn = ['024', '025', '053', '054', '055', '059'];
    const telecel = ['020', '050'];
    const at = ['026', '027', '056', '057'];
    if (mtn.includes(prefix)) return '13';
    if (telecel.includes(prefix)) return '6';
    if (at.includes(prefix)) return '7';
    return null;
  }
  let currentExternalRef = null;
  let currentStep = 1;
  let detectedNetwork = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const profile = await getUserProfile(user.uid);
    if (!profile) { window.location.href = 'complete-profile.html'; return; }
    currentUser = user;

    const list = tierType === 'subscription' ? SUBSCRIPTIONS : ANIMALS;
    const item = list.find(function(i) { return i.key === tierKey; });
    if (!item) { showPageError('Invalid item selected'); return; }

    itemPrice = item.price;
    document.getElementById('itemName').textContent = item.name;
    document.getElementById('itemPrice').textContent = item.price === 0 ? 'Free' : 'GHS ' + item.price.toLocaleString();

    document.body.classList.add('ready');
  });

  window.goToStep = function(n) {
    currentStep = n;
    [1, 2, 3].forEach(function(i) {
      document.getElementById('step' + i).style.display = i === n ? 'block' : 'none';
      document.getElementById('dot' + i).classList.toggle('active', i === n);
    });
  };

  window.headerBack = function() {
    if (currentStep > 1 && currentStep < 3) {
      goToStep(currentStep - 1);
    } else {
      window.location.href = tierType === 'subscription' ? 'subscription.html' : 'ranch-store.html';
    }
  };

  window.initiatePayment = async function() {
    const phone = document.getElementById('payPhone').value.trim();
    if (!phone) { toast('Enter your Mobile Money number', 'error'); return; }

    detectedNetwork = detectNetwork(phone);
    if (!detectedNetwork) { toast('Could not detect your network from this number', 'error'); return; }

    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

    currentExternalRef = tierType + '-' + tierKey + '-' + currentUser.uid.slice(0, 6) + '-' + Date.now();

    try {
      const res = await fetch(WORKER_URL + '/moolre-collect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, amount: String(itemPrice), channel: detectedNetwork, externalref: currentExternalRef })
      });
      const data = await res.json();

      if (data.code === 'TP14') {
        toast('Enter the OTP sent to your phone', 'success');
        goToStep(2);
      } else if (data.code === 'TR099') {
        toast('Payment request sent! Approve it on your phone.', 'success');
        goToStep(3);
        pollStatus();
      } else {
        toast(data.message || 'Payment failed. Try again.', 'error');
      }
    } catch (e) {
      toast('Something went wrong. Try again.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Pay Now';
    }
  };

  window.submitOtp = async function(isRetry) {
    const phone = document.getElementById('payPhone').value.trim();
    const otp = document.getElementById('otpInput').value.trim();
    if (!otp) { toast('Enter the OTP code', 'error'); return; }

    const btn = document.getElementById('otpBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Confirming...';

    try {
      const res = await fetch(WORKER_URL + '/moolre-collect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, amount: String(itemPrice), channel: detectedNetwork, externalref: currentExternalRef, otpcode: otp })
      });
      const data = await res.json();

      if (data.code === 'TR099') {
        goToStep(3);
        pollStatus();
      } else if (data.message && data.message.toLowerCase().indexOf('verification successful') !== -1 && !isRetry) {
        await submitOtp(true);
        return;
      } else {
        toast(data.message || 'Incorrect OTP. Try again.', 'error');
      }
    } catch (e) {
      toast('Something went wrong. Try again.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Confirm';
    }
  };

  function pollStatus() {
    let attempts = 0;
    const maxAttempts = 45;

    document.getElementById('processingIcon').style.display = 'block';
    document.getElementById('processingText').textContent = 'Confirming your payment...';
    document.getElementById('processingHint').style.display = 'block';
    document.getElementById('retryCheckBtn').style.display = 'none';

    const interval = setInterval(async function() {
      attempts++;
      try {
        const res = await fetch(WORKER_URL + '/moolre-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ externalref: currentExternalRef })
        });
        const data = await res.json();

        if (data.data && data.data.txstatus === 1) {
          clearInterval(interval);
          await completePurchase();
        } else if (attempts >= maxAttempts) {
          clearInterval(interval);
          document.getElementById('processingIcon').style.display = 'none';
          document.getElementById('processingText').textContent = "Still waiting on confirmation from your network.";
          document.getElementById('processingHint').style.display = 'none';
          document.getElementById('retryCheckBtn').style.display = 'inline-block';
        }
      } catch (e) {
        // keep trying
      }
    }, 4000);
  }

  window.retryCheckStatus = function() {
    pollStatus();
  };

  async function completePurchase() {
    try {
      const res = await fetch(WORKER_URL + '/complete-purchase', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: currentUser.uid, externalref: currentExternalRef, tierType: tierType, tierKey: tierKey })
      });
      const data = await res.json();

      if (data.ok) {
        document.getElementById('successText').textContent = "You're now on " + document.getElementById('itemName').textContent + '.';
        document.getElementById('step3').style.display = 'none';
        document.getElementById('step4').style.display = 'block';
      } else {
        document.getElementById('processingText').textContent = 'Payment confirmed but crediting failed. Contact support.';
      }
    } catch (e) {
      document.getElementById('processingText').textContent = 'Payment confirmed but crediting failed. Contact support.';
    }
  }
</script>
</body>
</html>
