<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f9d8c" id="metaTheme">
<title>Rancharm Subscription</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<link rel="stylesheet" href="styles.css?v=2">
<script>
function syncThemeColor(){
  var meta = document.getElementById('metaTheme');
  if (!meta) return;
  var isDark = document.documentElement.classList.contains('theme-dark') ||
    (!document.documentElement.classList.contains('theme-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  meta.setAttribute('content', isDark ? '#0b1210' : '#0f9d8c');
}
(function(){
  var t = localStorage.getItem('rancharm-theme');
  if (t === 'dark') document.documentElement.classList.add('theme-dark');
  else if (t === 'light') document.documentElement.classList.add('theme-light');
  syncThemeColor();
})();
document.addEventListener('DOMContentLoaded', syncThemeColor);
</script>
<script src="toast.js?v=2"></script>
<script>
function showPageError(msg) {
  var loader = document.getElementById('pageLoader');
  if (!loader) return;
  loader.innerHTML = '<div style="text-align:center;padding:24px;max-width:320px;">' +
    '<div style="color:#f43f5e;font-weight:800;margin-bottom:10px;font-size:15px;">Page Error</div>' +
    '<div style="font-size:12px;color:var(--text-dim);word-break:break-word;">' + msg + '</div></div>';
  loader.style.opacity = '1';
  loader.style.pointerEvents = 'auto';
}
window.addEventListener('error', function(e) {
  showPageError((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  showPageError(msg);
});
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</head>
<body>
<div class="page-loader page-loader-app" id="pageLoader"><dotlottie-wc src="https://lottie.host/455b3c68-8f9a-4345-b369-2fd3162bc953/Qc4CNAKTcR.json" style="width:140px;height:140px;" autoplay loop></dotlottie-wc></div>

<div class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="topbar-logo">Ranch<span>arm</span></div>
    <a class="icon-btn" href="https://whatsapp.com/channel/0029VbDYtgnDuMRX0yFQVo1h" target="_blank" rel="noopener" style="text-decoration:none;"><i class="fa-brands fa-whatsapp"></i></a>
  </div>
</div>

<div class="page">
  <div class="section-title" style="margin-top:0">Subscription</div>
  <div id="subsList">
    <div class="skeleton" style="height:140px;margin-bottom:14px;"></div>
    <div class="skeleton" style="height:140px;margin-bottom:14px;"></div>
  </div>
</div>

<script type="module">
  import { auth, db, doc, updateDoc, getUserProfile, SUBSCRIPTIONS } from './firebase-config.js?v=3';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const profile = await getUserProfile(user.uid);
    if (!profile) { window.location.href = 'complete-profile.html'; return; }

    renderSubscriptions(profile.subscriptionTier || 'free');
    document.body.classList.add('ready');
  });

  function renderSubscriptions(currentSub) {
    const list = document.getElementById('subsList');
    list.innerHTML = '';

    SUBSCRIPTIONS.forEach((sub, i) => {
      const isCurrent = sub.key === currentSub;
      const benefitsHtml = sub.benefits.map(function(b) {
        return '<div class="benefit-row"><i class="fa-solid fa-circle-check"></i> ' + b + '</div>';
      }).join('');

      const card = document.createElement('div');
      card.className = 'animal-detail-card reveal' + (isCurrent ? ' sub-card-current' : '');
      card.style.animationDelay = (i * 0.05) + 's';
      card.innerHTML =
        '<div class="animal-detail-top"><div><div class="animal-detail-name">' + sub.name + '</div></div></div>' +
        '<div class="animal-detail-price">' + (sub.price === 0 ? 'Free' : 'GHS ' + sub.price.toLocaleString() + '/month') + '</div>' +
        '<div class="animal-benefits">' + benefitsHtml + '</div>' +
        (isCurrent ? '<div class="current-badge">Current Plan</div>' : '<button class="btn-small" data-sub-key="' + sub.key + '" onclick="subscribeClick(this)">Subscribe</button>');
      list.appendChild(card);
    });
  }

  window.subscribeClick = async (btn) => {
    const key = btn.dataset.subKey;

    if (key === 'free') {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      try {
        await updateDoc(doc(db, "users", auth.currentUser.uid), { subscriptionTier: 'free' });
        toast('Downgraded to Free plan', 'success');
        setTimeout(function() { window.location.reload(); }, 1000);
      } catch (e) {
        toast('Something went wrong. Try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Subscribe';
      }
      return;
    }

    window.location.href = 'checkout.html?type=subscription&key=' + key;
  };
</script>
</body>
</html>
